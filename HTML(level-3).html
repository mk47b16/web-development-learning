<!-- Q3 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Level-3</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <div>
        <label for="Name">Name:</label>
        <input type="text" id="Name" placeholder="Wrtie your name">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Wrtie your email">
    </div>
    <br>
    <div>
        <label for="Message">Message:</label>
        <br>
        <textarea name="Message" id="Message" rows="4" cols="30"></textarea>
    </div>
    <br>
    <div>
        <label for="rate">Rate us our of 5:</label>
        <br>
        <input type="radio" name="rate" id="1" value="1">
        <label for="1">1</label>
        <br>
        <input type="radio" name="rate" id="2" value="2">
        <label for="2">2</label>
        <br>
        <input type="radio" name="rate" id="3" value="3">
        <label for="3">3</label>
        <br>
        <input type="radio" name="rate" id="4" value="4">
        <label for="4">4</label>
        <br>
        <input type="radio" name="rate" id="5" value="5">
        <label for="5">5</label>
        <br>
    </div>
    <br>
    <br>
    <button>Send your message!</button>
    
</body>
</html>
